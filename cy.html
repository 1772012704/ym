<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>以爱之名留在兮兮身边</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "STKaiti", serif;
    /* 背景固定铺满全屏，任意设备自适应 */
    background: linear-gradient(180deg, #b8d8ff 0%, #e8c8e8 45%, #fbd7cf 75%, #ffe3e8 100%);
    background-size: cover;
    background-attachment: fixed;
  }
  .scene { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; }

  /* 背景光晕 */
  .glow { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .6; }
  .glow.g1 { width: 60vmin; height: 60vmin; background: #ffd6e8; top: 6%; left: -8%; }
  .glow.g2 { width: 50vmin; height: 50vmin; background: #cfe4ff; bottom: 4%; right: -8%; }

  /* 文案区 —— 使用安全区，居中，随屏幕缩放 */
  .text-box {
    position: fixed; z-index: 5; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: max(30px, env(safe-area-inset-bottom));
    box-sizing: border-box;
  }
  .main-title {
    /* 主标题：单行不折行 + 随屏幕自适应缩放 */
    white-space: nowrap;
    font-size: clamp(16px, 3.2vmin, 30px);  /* 任意屏幕都合适 */
    letter-spacing: 0.3em; font-weight: 700;
    color: #d84f7d; text-shadow: 0 2px 12px rgba(255,255,255,.9);
    animation: fadeUp 2s ease forwards;
  }
  .sub-title {
    margin-top: 3vh; font-size: clamp(14px, 2.6vmin, 24px);
    letter-spacing: 0.35em; color: #a35b7c;
    animation: fadeUp 2.2s ease forwards;
  }
  .sign {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    margin-top: 5vh; font-size: clamp(13px, 2.4vmin, 22px);
    color: #8a5f76; letter-spacing: 0.15em;
    animation: fadeUp 2.6s ease forwards;
  }
  .sign .dash { color: #c78aa5; white-space: nowrap; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 樱花树 —— 自适应底部位置 */
  .tree {
    position: absolute; z-index: 1;
    bottom: -4%; left: 14%;
    transform-origin: bottom;
    /* 用 vh 自适应用于不同高度的屏幕 */
    width: auto;
  }
  .trunk {
    width: min(46px, 6vmin); height: 45vh; min-height: 220px; max-height: 420px;
    margin: 0 auto;
    background: linear-gradient(90deg,#6b4a32,#8a6046,#6b4a32);
    border-radius: 20px 20px 8px 8px; position: relative;
  }
  .branch { position: absolute; background: #7a543c; border-radius: 20px; }
  .b1 { width: 18vmin; height: 26px; top: 12%; left: -80%; transform: rotate(-25deg); }
  .b2 { width: 22vmin; height: 26px; top: 30%; left: 30%;  transform: rotate(25deg); }
  .b3 { width: 14vmin; height: 22px; top: 55%; left: -50%; transform: rotate(-40deg); }
  .cluster { position:absolute; border-radius:50%;
             background: radial-gradient(circle at 35% 35%, #fff0f5, #ffc4d6 55%, #f4a7c1);
             box-shadow: 0 4px 14px rgba(216,79,125,.35); }
  .c1 { width: 9vmin; height:9vmin; top:-6%;  left:-110%; }
  .c2 { width:11vmin; height:11vmin;top:-8%;  left:-25%; }
  .c3 { width: 9vmin; height:9vmin; top:-4%;  left:70%; }
  .c4 { width: 8vmin; height:8vmin; top:12%;  left:-130%; }
  .c5 { width: 9vmin; height:9vmin; top:15%;  left:15%; }
  .c6 { width: 8vmin; height:8vmin; top:17%;  left:100%; }
  .c7 { width: 7vmin; height:7vmin; top:35%;  left:-70%; }

  /* 飘落花瓣 */
  .petal { position:absolute; top:-6%; opacity:.85;
           background: radial-gradient(circle at 40% 35%, #fff, #ffd9e8 60%, #ffb3cf);
           border-radius: 150% 0 150% 0;
           filter: drop-shadow(0 2px 3px rgba(216,79,125,.25));
           animation: fall linear infinite; }
  @keyframes fall {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); }
    100% { transform: translateY(110vh) translateX(8vw) rotate(720deg); }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div class="tree">
      <div class="cluster c1"></div><div class="cluster c2"></div>
      <div class="cluster c3"></div><div class="cluster c4"></div>
      <div class="cluster c5"></div><div class="cluster c6"></div>
      <div class="cluster c7"></div>
      <div class="branch b1"></div><div class="branch b2"></div>
      <div class="branch b3"></div>
      <div class="trunk"></div>
    </div>

    <div class="text-box">
      <h1 class="main-title">🌸 以爱之名留在兮兮身边 🌸</h1>
      <div class="sub-title">只想与你，落英缤纷，相伴到老</div>
      <div class="sign"><span class="dash">——</span> 兮兮，你是春天，也是我的一切 <span class="dash">——</span></div>
    </div>
  </div>

  <script>
    /* 根据屏幕宽度决定花瓣数量：移动端少、桌面多，兼顾流畅 */
    var isMobile = window.innerWidth < 768;
    var count = isMobile ? 20 : 45;
    var petalColors = ['#ffd9e8','#ffc4d6','#f4a7c1','#ffe3ee'];
    for (var i = 0; i < count; i++) {
      var p = document.createElement('div');
      p.className = 'petal';
      var size = (isMobile ? 10 : 12) + Math.random() * 18;
      p.style.width = size + 'px';
      p.style.height = size * 0.7 + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.background = 'radial-gradient(circle at 40% 35%, #fff, ' +
        petalColors[Math.floor(Math.random()*petalColors.length)] + ' 60%, #ff9ebd)';
      p.style.animationDuration = (6 + Math.random() * 7) + 's';
      p.style.animationDelay = (-Math.random() * 12) + 's';
      p.style.opacity = 0.5 + Math.random() * 0.4;
      document.body.appendChild(p);
    }
  </script>
</body>
</html>
